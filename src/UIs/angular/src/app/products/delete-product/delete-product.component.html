<button type="button" class="btn btn-primary btn-danger" (click)="openModal(template)">
  <app-action-icon action="delete" />Delete
</button>

<ng-template #template>
  <app-modal-header><app-action-icon action="delete" />Delete Product</app-modal-header>
  <app-modal-body class="text-center">
    <p>
      Are you sure you want to delete <strong> {{ product.name }}</strong>
    </p>
  </app-modal-body>
  <app-modal-footer align="center">
    <button type="button" class="btn btn-primary" (click)="confirm()"><app-action-icon action="confirm" />Yes</button>
    <button type="button" class="btn btn-default" (click)="decline()"><app-action-icon action="cancel" />No</button>
  </app-modal-footer>
</ng-template>
