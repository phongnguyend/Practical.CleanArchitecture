<div class="card">
  <div class="card-header"><app-action-icon action="audit" />Audit Logs</div>
  <div class="card-body">
    <div class="table-responsive">
      <div style="float: right">
        <app-pagination
          [totalItems]="totalItems"
          [currentPage]="currentPage"
          [pageSize]="5"
          (pageSelected)="pageChanged($event)"
        >
        </app-pagination>
      </div>
      @if (auditLogs) {
        <table class="table">
          <thead>
            <tr>
              <th>Date Time</th>
              <th>User Name</th>
              <th>Action</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody>
            @for (auditLog of auditLogs; track auditLog) {
              <tr>
                <td>
                  {{ auditLog.createdDateTime | date: "dd/MM/yyyy hh:mm:ss" }}
                </td>
                <td>{{ auditLog.userName }}</td>
                <td><app-audit-action [action]="auditLog.action" /></td>
                <td>
                  <div class="position-relative">
                    <div class="audit-data-actions">
                      <div class="d-flex">
                        <app-json-viewer [jsonData]="auditLog.log" />
                        <app-copy-to-clipboard
                          [text]="auditLog.log"
                          [className]="'custom-icon'"
                          [title]="'Copy this text'"
                        ></app-copy-to-clipboard>
                      </div>
                    </div>
                    <div class="audit-data-preview">{{ auditLog.log }}</div>
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      }
      <div style="float: right">
        <app-pagination
          [totalItems]="totalItems"
          [currentPage]="currentPage"
          [pageSize]="5"
          (pageSelected)="pageChanged($event)"
        >
        </app-pagination>
      </div>
    </div>
  </div>
</div>
