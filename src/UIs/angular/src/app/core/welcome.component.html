<div class="card">
  <div class="card-header"><app-action-icon action="home" />
    {{ pageTitle | appendVersion: " version: " }}
    <div style="float: right;color: green">
      <app-timer></app-timer>
    </div>
  </div>
  <div class="card-body">
    <div class="container-fluid">
      <div class="text-center">
        <img src="./assets/images/logo.png" class="img-responsive center-block"
          style="max-height:300px;padding-bottom:10px" />
      </div>

      <div class="text-center">Developed by:</div>
      <div class="text-center">
        <h3>Phong Nguyen</h3>
      </div>

      <div class="text-center">&#64;phongnguyend</div>
      <div class="text-center">
        <a href="https://github.com/phongnguyend/Practical.CleanArchitecture"><app-action-icon action="external" />
          Practical.CleanArchitecture
        </a>
      </div>
      <div class="text-center">
        <strong>angular v{{ version }}</strong>
      </div>
      <div class="text-center">{{ "" | appendCurrentDateTime: "" }}</div>
    </div>
  </div>
</div>
