<span class="app-copy-control">
  <button type="button" [class]="'app-copy-trigger ' + className" [title]="title" [attr.aria-label]="title" (click)="handleCopy()">
    <ng-icon name="lucideClipboard" size="18" aria-hidden="true" />
  </button>
  <span class="app-copy-feedback" role="status">{{ copyStatus }}</span>
</span>
