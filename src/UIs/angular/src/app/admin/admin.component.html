<section class="card"><div class="card-body">
  <nav aria-label="Admin sections" class="nav nav-tabs mb-3">
    <a routerLink="/admin/playgrounds" class="nav-link" [class.active]="view !== 'admin'" [attr.aria-current]="view !== 'admin' ? 'page' : null"><app-action-icon action="settings" />Playgrounds</a>
  </nav>
  @if (view !== 'admin') {
    <nav aria-label="Playground channels" class="nav nav-tabs mb-3 flex-wrap">
      @for (tab of channels; track tab.value) {
        <a [routerLink]="'/admin/playgrounds/' + tab.path" class="nav-link" [class.active]="view === tab.value" [attr.aria-current]="view === tab.value ? 'page' : null"><app-action-icon action="notification" />{{ tab.label }}</a>
      }
    </nav>
  }
  @if (view === 'admin' || view === 'playgrounds') {
    <h1>{{ view === 'admin' ? 'Admin' : 'Playgrounds' }}</h1>
    <p>Choose a playground to inspect its queue and compose a message.</p>
  } @else {
    <app-notification-playgrounds [channel]="view" />
  }
</div></section>
