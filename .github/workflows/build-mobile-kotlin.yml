name: Build Mobile Kotlin

on:
  push:
    paths:
      - "src/Mobiles/Kotlin/**"
      - "src/Mobiles/tools/prepare_firebase.py"
      - "src/Mobiles/tools/test_prepare_firebase.py"
      - ".github/workflows/build-mobile-kotlin.yml"
  pull_request:
    paths:
      - "src/Mobiles/Kotlin/**"
      - "src/Mobiles/tools/prepare_firebase.py"
      - "src/Mobiles/tools/test_prepare_firebase.py"
      - ".github/workflows/build-mobile-kotlin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This Jetpack Compose application has no iOS target.
jobs:
  android:
    name: Kotlin Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: src/Mobiles/Kotlin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test Firebase configuration validation
        run: python3 -m unittest discover -s ../tools -p test_prepare_firebase.py
      - name: Prepare optional Firebase configuration
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_KOTLIN_ANDROID_CONFIG_BASE64 }}
        run: python3 ../tools/prepare_firebase.py --app Kotlin --platform android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Override the default, which includes the obsolete SDK "tools" package.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, lint, and unit tests
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug -PcrashlyticsEnabled="$FIREBASE_ENABLED" :app:lintDebug :app:testDebugUnitTest
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-android-debug
          path: src/Mobiles/Kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-android-reports
          path: |
            src/Mobiles/Kotlin/app/build/reports/
            src/Mobiles/Kotlin/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
