name: Docker Build - UI Blazor

on:
  push:
    paths:
      - 'src/UIs/blazor/**'
      - 'src/Monolith/**'
      - '.github/workflows/docker-build-ui-blazor.yml'
  pull_request:
    paths:
      - 'src/UIs/blazor/**'
      - 'src/Monolith/**'
      - '.github/workflows/docker-build-ui-blazor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: blazor-server
            image: classifiedads.blazor
          - service: blazor-wasm
            image: classifiedads.blazor.wasm
    defaults:
      run:
        working-directory: src/UIs/blazor
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker compose build ${{ matrix.service }}
      - name: Publish image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/build')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          repository="ghcr.io/${REPOSITORY,,}/$IMAGE"
          docker tag "$IMAGE" "$repository:$COMMIT_SHA"
          docker push "$repository:$COMMIT_SHA"
          if [ "$REF_NAME" = master ]; then
            docker tag "$IMAGE" "$repository:latest"
            docker push "$repository:latest"
          fi
