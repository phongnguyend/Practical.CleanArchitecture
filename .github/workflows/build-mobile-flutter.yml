name: Build Mobile Flutter

on:
  push:
    paths:
      - "src/Mobiles/Flutter/**"
      - "src/Mobiles/tools/prepare_firebase.py"
      - "src/Mobiles/tools/prepare_sentry.py"
      - "src/Mobiles/tools/test_prepare_sentry.py"
      - ".github/workflows/build-mobile-flutter.yml"
  pull_request:
    paths:
      - "src/Mobiles/Flutter/**"
      - "src/Mobiles/tools/prepare_firebase.py"
      - "src/Mobiles/tools/prepare_sentry.py"
      - "src/Mobiles/tools/test_prepare_sentry.py"
      - ".github/workflows/build-mobile-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DSN: ${{ secrets.SENTRY_FLUTTER_DSN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_FLUTTER_PROJECT }}
  SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'ci' }}
  SENTRY_RELEASE: mobile-flutter@${{ github.sha }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_DISABLE_AUTO_UPLOAD: ${{ (secrets.SENTRY_AUTH_TOKEN == '' || vars.SENTRY_ORG == '' || vars.SENTRY_FLUTTER_PROJECT == '') && 'true' || 'false' }}

jobs:
  android:
    name: Flutter Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: src/Mobiles/Flutter
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare optional Sentry configuration
        run: python3 ../tools/prepare_sentry.py --app Flutter
      - name: Prepare optional Firebase configuration
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_FLUTTER_ANDROID_CONFIG_BASE64 }}
        run: python3 ../tools/prepare_firebase.py --app Flutter --platform android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Override the default, which includes the obsolete SDK "tools" package.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install dependencies from lockfile
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --debug --no-pub --dart-define-from-file=firebase-defines.json --dart-define-from-file=sentry.config.json
      - name: Upload Sentry debug symbols
        if: env.SENTRY_DISABLE_AUTO_UPLOAD == 'false'
        run: dart run sentry_dart_plugin
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-debug
          path: src/Mobiles/Flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Flutter iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Firebase iOS SDK 13.x requires Swift tools 6.2; the runner default is older.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: src/Mobiles/Flutter
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare optional Sentry configuration
        run: python3 ../tools/prepare_sentry.py --app Flutter
      - name: Verify iOS toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Prepare optional Firebase configuration
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_FLUTTER_IOS_CONFIG_BASE64 }}
        run: python3 ../tools/prepare_firebase.py --app Flutter --platform ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install dependencies from lockfile
        run: flutter pub get --enforce-lockfile
      - name: Build iOS simulator app
        run: |
          flutter build ios --simulator --debug --no-codesign --no-pub --dart-define-from-file=firebase-defines.json --dart-define-from-file=sentry.config.json
          tar -czf build/flutter-ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - name: Upload Sentry debug symbols
        if: env.SENTRY_DISABLE_AUTO_UPLOAD == 'false'
        run: dart run sentry_dart_plugin
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-simulator
          path: src/Mobiles/Flutter/build/flutter-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14

