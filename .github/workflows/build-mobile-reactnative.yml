name: Build Mobile React Native

on:
  push:
    paths:
      - "src/Mobiles/ReactNative/**"
      - "src/Mobiles/tools/prepare_firebase.py"
      - "src/Mobiles/tools/prepare_sentry.py"
      - "src/Mobiles/tools/test_prepare_sentry.py"
      - ".github/workflows/build-mobile-reactnative.yml"
  pull_request:
    paths:
      - "src/Mobiles/ReactNative/**"
      - "src/Mobiles/tools/prepare_firebase.py"
      - "src/Mobiles/tools/prepare_sentry.py"
      - "src/Mobiles/tools/test_prepare_sentry.py"
      - ".github/workflows/build-mobile-reactnative.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DSN: ${{ secrets.SENTRY_REACTNATIVE_DSN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_REACTNATIVE_PROJECT }}
  SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'ci' }}
  SENTRY_RELEASE: mobile-reactnative@${{ github.sha }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_DISABLE_AUTO_UPLOAD: ${{ (secrets.SENTRY_AUTH_TOKEN == '' || vars.SENTRY_ORG == '' || vars.SENTRY_REACTNATIVE_PROJECT == '') && 'true' || 'false' }}
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: React Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: src/Mobiles/ReactNative
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare optional Sentry configuration
        run: python3 ../tools/prepare_sentry.py --app ReactNative
      - name: Prepare optional Firebase configuration
        env:
          MOBILE_PUSH_ENABLED: ${{ vars.MOBILE_PUSH_ENABLED || 'false' }}
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_REACTNATIVE_ANDROID_CONFIG_BASE64 }}
        run: python3 ../tools/prepare_firebase.py --app ReactNative --platform android
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Mobiles/ReactNative/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, and tests
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:ui -- --ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Override the default, which includes the obsolete SDK "tools" package.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build Android APK with bundled JavaScript
        working-directory: src/Mobiles/ReactNative/android
        # Expo's generated release build uses a debug key; this is a CI artifact, not a store release.
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: reactnative-android-release-ci
          path: src/Mobiles/ReactNative/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: React Native iOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # ExpoModulesJSI requires Swift tools 6.2; macos-15 defaults to Xcode 16.4 / Swift 6.1.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: src/Mobiles/ReactNative
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare optional Sentry configuration
        run: python3 ../tools/prepare_sentry.py --app ReactNative
      - name: Prepare optional Firebase configuration
        env:
          MOBILE_PUSH_ENABLED: ${{ vars.MOBILE_PUSH_ENABLED || 'false' }}
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_REACTNATIVE_IOS_CONFIG_BASE64 }}
        run: python3 ../tools/prepare_firebase.py --app ReactNative --platform ios
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Mobiles/ReactNative/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify iOS toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install
      - name: Install iOS pods
        working-directory: src/Mobiles/ReactNative/ios
        run: pod install
      - name: Build iOS simulator app with bundled JavaScript
        run: |
          xcodebuild \
            -workspace ios/ClassifiedAds.xcworkspace \
            -scheme ClassifiedAds \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build
          tar -czf build/reactnative-ios-simulator.tar.gz \
            -C build/ios/Build/Products/Release-iphonesimulator ClassifiedAds.app
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: reactnative-ios-simulator
          path: src/Mobiles/ReactNative/build/reactnative-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14

