name: Build Mobile React Native

on:
  push:
    paths:
      - "src/Mobiles/ReactNative/**"
      - ".github/workflows/build-mobile-reactnative.yml"
  pull_request:
    paths:
      - "src/Mobiles/ReactNative/**"
      - ".github/workflows/build-mobile-reactnative.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: React Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: src/Mobiles/ReactNative
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Mobiles/ReactNative/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, and tests
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:ui -- --ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build Android APK with bundled JavaScript
        working-directory: src/Mobiles/ReactNative/android
        # Expo's generated release build uses a debug key; this is a CI artifact, not a store release.
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: reactnative-android-release-ci
          path: src/Mobiles/ReactNative/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: React Native iOS
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: src/Mobiles/ReactNative
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Mobiles/ReactNative/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install
      - name: Install iOS pods
        working-directory: src/Mobiles/ReactNative/ios
        run: pod install
      - name: Build iOS simulator app with bundled JavaScript
        run: |
          xcodebuild \
            -workspace ios/ClassifiedAds.xcworkspace \
            -scheme ClassifiedAds \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build
          tar -czf build/reactnative-ios-simulator.tar.gz \
            -C build/ios/Build/Products/Release-iphonesimulator ClassifiedAds.app
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: reactnative-ios-simulator
          path: src/Mobiles/ReactNative/build/reactnative-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14

